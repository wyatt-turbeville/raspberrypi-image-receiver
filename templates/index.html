<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" />
    <title>Turf Image Directory</title>
    <link rel="stylesheet" href="{{ url_for('static', path='index_styles.css') }}">
</head>
<body class="layout">

    <header>
        <span class="left_spacer"></span>
        <a href="/" class="directory_tab">
            <span >Directory</span>
        </a>
        <span class="folder_tab">Folder</span>
        <a href="/search" class="search_tab">
            <span>Search</span>
        </a>
        <span class="right_spacer"></span>
    </header>

    <main class="folder_container">
        {% for cam_id in camera_ids %}
            <a href="/folder?id={{ cam_id }}" class="folder_card">
                <img class="folder_icon" src="{{ url_for('static', path='images/folder-icon.png') }}" alt="Folder Icon">
                <p class="folder_caption">Plot {{ cam_id }}</p>
            </a>
        {% endfor %}
    </main>

    <footer>
        <p class="footer_caption">
            {{ footer_count["camera_count"] }} Folders, {{ footer_count["image_count"] }} Images
        </p>
    </footer>

</body>
</html>
