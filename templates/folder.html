<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" />
    <title>Turf Image Directory</title>
    <link rel="stylesheet" href="{{ url_for('static', path='folder_styles.css') }}">
</head>
<body class="layout">

    <header>
        <span class="left_spacer"></span>
        <a href="/" class="directory_tab">
            <span >Directory</span>
        </a>
        <span class="folder_tab">Folder</span>
        <a href="/search" class="search_tab">
            <span>Search</span>
        </a>
        <span class="right_spacer"></span>
    </header>

    <main class="row_container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                </tr>
            </thead>
            <tbody>
                {% for row in image_list %}
                    <tr class="click_row" data-id="{{ row[0] }}">
                        <td class="img_cell">
                            <img class="photo_icon" src="{{ url_for('static', path='images/photo-icon.png') }}" alt="Photo Icon">
                        </td>
                        <td>{{ row[1] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <div id="imageModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <img id="modalImage" src="" alt="Popup View" style="max-width: 100%;">
            </div>
        </div>

    </main>

    <footer>
        <p class="footer_caption">{{ image_list|length }} Images</p>
    </footer>

    <script src="{{ url_for('static', path='modal.js') }}"></script>
</body>
</html>
